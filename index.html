<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Goob Infection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="visor" hidden></div>
    <div id="location" hidden></div>
    <div id="objective" hidden></div>
    <div id="crosshair"></div>
    <div id="prompt" hidden></div>
    <div id="toast" hidden></div>
    <div id="debug" hidden></div>
    <div id="goob-hud" hidden>
      <div class="goob-row" id="suit-row">
        <span class="goob-label">Suit</span>
        <div class="tank-bar suit-bar"><i id="suit-fill"></i></div>
        <span id="suit-text">100%</span>
      </div>
      <div class="goob-row" id="tank-row">
        <span class="goob-label">Tank</span>
        <div class="tank-bar"><i id="tank-fill"></i></div>
        <span id="tank-text">0 / 30 L</span>
      </div>
      <div class="goob-row" id="cleaned-row">
        <span class="goob-label">Goob cleaned</span>
        <span id="cleaned-text">0%</span>
      </div>
    </div>
    <div id="dialogue" hidden>
      <div id="dialogue-speaker"></div>
      <p id="dialogue-text"></p>
      <div class="more">[E]</div>
    </div>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <section id="title" class="screen title-screen">
    <h1>The Goob<br>Infection</h1>
    <nav class="menu" aria-label="Main menu">
      <button id="menu-play" type="button">Play Chapter 1: The Infection</button>
      <button id="menu-difficulty" type="button">Difficulty: Normal</button>
      <button id="menu-quit" type="button">Quit</button>
    </nav>
    <p class="difficulty-note" id="difficulty-note"></p>
    <p class="hint">WASD move · Mouse look · E interact · Shift run · Space jump · Esc pause</p>
  </section>

  <section id="pause" class="screen dim-screen" hidden>
    <h2>Paused</h2>
    <nav class="menu" aria-label="Pause menu">
      <button id="pause-resume" type="button">Resume</button>
      <button id="pause-title" type="button">Quit to title</button>
    </nav>
  </section>

  <section id="breached" class="screen breach-screen" hidden>
    <h2>Suit breached</h2>
    <p>The goob got in. You feel... surprisingly happy.</p>
    <nav class="menu" aria-label="Game over">
      <button id="breach-retry" type="button">Try again from last checkpoint</button>
      <button id="breach-title" type="button">Back to title</button>
    </nav>
  </section>

  <section id="ready" class="screen dim-screen" hidden>
    <h2>Ready?</h2>
    <nav class="menu" aria-label="Start">
      <button id="ready-play" type="button">Click to play</button>
    </nav>
  </section>

  <section id="tbc" class="screen dim-screen" hidden>
    <h2 id="tbc-heading">To be continued</h2>
    <p id="tbc-text"></p>
    <p class="hint" id="tbc-hint"></p>
    <nav class="menu" aria-label="End menu">
      <button id="tbc-title" type="button">Back to title</button>
    </nav>
  </section>

  <section id="quit" class="screen title-screen" hidden>
    <h2>Thanks for playing</h2>
    <p>You can close this tab now.</p>
    <nav class="menu" aria-label="Quit menu">
      <button id="quit-back" type="button">Back to title</button>
    </nav>
  </section>
  <script type="module" src="src/main.js"></script>
</body>
</html>
